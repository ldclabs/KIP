name: CI

# Unit tests and checks for both workspace packages. Runs on every push to main
# and every pull request that touches a package, the current protocol, or shared
# workspace files. The frozen v1 archive is outside the active workspace.
# Publishing lives in the separate kip-lang.yml / vscode-kip.yml workflows.
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "*.md"
      - "brain/**"
      - "schemas/**"
      - "grammar/**"
      - "profiles/**"
      - "conformance/**"
      - "formal/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "packages/**"
      - "*.md"
      - "brain/**"
      - "schemas/**"
      - "grammar/**"
      - "profiles/**"
      - "conformance/**"
      - "formal/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kip-lang:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pretest` compiles TypeScript to dist/ before the node:test suite runs.
      - name: Test @ldclabs/kip-lang
        run: pnpm --filter @ldclabs/kip-lang test

      - name: Verify canonical artifact digests
        run: node conformance/update-digests.mjs

  memory-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check finite memory models and injected regressions
        run: |
          python3 formal/governance/check_governance.py
          python3 formal/grammar/check_ebnf.py
          for mode in '' --self-graded --family-join --skip-trial --count-imported --no-gate --observation-count --reuse-trial --edit-revision; do
            python3 formal/lifecycle/check_lifecycle.py $mode
          done
          python3 formal/watch/check_watch.py
          python3 formal/watch/check_watch.py --premature-silence
          python3 formal/purge/check_purge.py
          python3 formal/purge/check_purge.py --hold-after-policy
          python3 formal/purge/check_purge.py --no-stub
          python3 formal/purge/check_purge.py --payload-drops-citations
          python3 formal/temporal/check_temporal.py
          for mode in --cross-actor --agreeing-cuts --no-start-bound --arrival-order --outrank-observation --infer-succeeds --recency-first; do
            python3 formal/temporal/check_temporal.py $mode
          done

  vscode-kip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The extension bundles @ldclabs/kip-lang, so it must be built first.
      - name: Build kip-lang (bundled dependency)
        run: pnpm --filter @ldclabs/kip-lang build

      - name: Type-check
        run: pnpm --filter vscode-kip lint

      - name: Bundle
        run: pnpm --filter vscode-kip build

      - name: Package (.vsix)
        run: pnpm --filter vscode-kip package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-kip-vsix
          path: packages/vscode-kip/*.vsix
          if-no-files-found: error
