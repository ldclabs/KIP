name: publish-kip-lang

# kip-lang release tags are `v<semver>`. The pattern must start the version with
# a digit: a bare `v*` also matches the extension's `vscode-kip-v*` release tags
# and would publish whatever kip-lang version is on that commit.
on:
  push:
    tags:
      - "v[0-9]*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Trusted Publishing (OIDC, tokenless) requires npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @ldclabs/kip-lang build

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a short-lived
      # publish token via the trusted publisher configured on npmjs.com, and
      # attaches provenance automatically.
      - name: Publish to npm (Trusted Publisher)
        working-directory: packages/kip-lang
        run: npm publish --access public
